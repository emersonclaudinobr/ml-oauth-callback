<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Callback</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #222; }
  code { background: #f2f2f2; padding: .2rem .4rem; border-radius: 4px; word-break: break-all; }
</style>
</head>
<body>
<h1>Callback OAuth</h1>
<p>Esta pagina so recebe o retorno do login. Nada e enviado para nenhum servidor.</p>
<p id="out"></p>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get('code');
  var el = document.getElementById('out');
  if (code) {
    el.textContent = 'Codigo de autorizacao: ';
    var c = document.createElement('code');
    c.textContent = code;
    el.appendChild(c);
  } else if (p.get('error')) {
    el.textContent = 'Erro: ' + p.get('error');
  }
</script>
</body>
</html>
